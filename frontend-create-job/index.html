<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Создание работы — HireTrack NX</title>
  <link rel="stylesheet" href="styles.css?v=11" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Создание работы</div>
    <a class="back-link" href="/">← Панель управления</a>
  </header>

  <main>
    <section class="card">
      <div class="mode-toggle">
        <button type="button" id="mode-new" class="mode-btn active">Новая работа</button>
        <button type="button" id="mode-existing" class="mode-btn">Существующая работа</button>
      </div>
      <p id="load-status" class="load-status"></p>
    </section>

    <!-- New-job mode: create just the job header (name/dates/client), then
         transition into the same section-based tree UI as an existing job -
         see "Создать работу" handling in app.js. -->
    <section class="card" id="new-job-card">
      <h2>Работа</h2>
      <div class="field-row">
        <label class="field">
          Название работы
          <input type="text" id="job-name" maxlength="50" placeholder="Например: Концерт — Иванов" />
        </label>
      </div>
      <div class="field-row">
        <label class="field">
          Дата и время начала
          <input type="datetime-local" id="date-from" />
          <span id="date-from-readback" class="date-readback"></span>
        </label>
        <label class="field">
          Дата и время окончания
          <input type="datetime-local" id="date-to" />
          <span id="date-to-readback" class="date-readback"></span>
        </label>
      </div>
      <p id="date-range-error" class="field-error hidden">Дата окончания должна быть позже даты начала.</p>
    </section>

    <section class="card" id="new-job-client-card">
      <h2>Клиент</h2>
      <div class="client-picker">
        <input type="text" id="client-search" placeholder="Начните вводить название компании…" autocomplete="off" />
        <div id="client-results" class="dropdown-results hidden"></div>
        <div id="client-selected" class="client-selected hidden">
          Выбран клиент: <strong id="client-selected-name"></strong>
          <button type="button" id="client-clear">Изменить</button>
        </div>
      </div>
    </section>

    <section class="card submit-card" id="new-job-submit-card">
      <button type="button" id="submit-btn" disabled>Создать работу</button>
      <div id="result" class="result hidden"></div>
    </section>

    <section class="card hidden" id="existing-job-card">
      <h2>Существующая работа</h2>
      <div class="job-picker">
        <input type="text" id="job-ref-search" placeholder="Название работы или клиент…" autocomplete="off" />
        <div id="job-ref-results" class="dropdown-results hidden"></div>
      </div>
      <p id="job-ref-status" class="load-status"></p>
      <div id="recent-jobs"></div>
      <div id="job-loaded-info" class="job-loaded-info hidden">
        <p><strong id="job-loaded-ref"></strong> — <span id="job-loaded-client"></span></p>
        <p class="job-loaded-dates">Даты работы: <strong id="job-loaded-dates"></strong> <span class="hint">(фиксированы — совпадают с уже существующими позициями)</span></p>
        <div id="existing-lines-tree" class="lines-tree"></div>
      </div>
    </section>
  </main>

  <script src="app.js?v=14"></script>
</body>
</html>
